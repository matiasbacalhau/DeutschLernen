name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      languagetool:
        image: erikvl87/languagetool:latest
        ports:
          - 8010:8010
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: tools/check.sh
        env:
          LT_URL: http://localhost:8010/v2
      - name: Armar el sitio (solo archivos de la app)
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js icons _site/
          sed -i "s/^const CACHE = 'dev';$/const CACHE = '${GITHUB_SHA::7}';/" _site/sw.js
          grep -q "const CACHE = '${GITHUB_SHA::7}';" _site/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
