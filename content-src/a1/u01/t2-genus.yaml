  # ───────────────────────────── Escalón 5 ─────────────────────────────
  - n: 5
    name: "Redactar"
    scene: {title: "Ein Brief an Mia", context: "Domingo a la noche · la primera noche tranquila en el departamento (Paul salió)"}
    exercises:
      - id: t2-5-wg-wohnung
        type: writing-guided
        topic: a1.u1.t2
        prompt: "Escribile a Mia, tu amiga chilena del hostel, cómo es tu departamento nuevo: qué ambientes tiene y cómo es cada uno."
        constraints:
          - "Nombrá al menos 4 ambientes o cosas con su artículo definido, y que estén los tres géneros."
          - "Entre 4 y 6 oraciones."
        tips:
          - "Con *sein* + adjetivo alcanza: *Die Küche ist klein.*"
          - "Las compuestas toman el artículo de la última parte: *das Wohnzimmer*, como *das Zimmer*."
          - "Por ahora evitá *es gibt* y *haben* con sustantivos: piden *Akkusativ* (objeto directo), que es el tema siguiente. Con *sein*, todo va en *Nominativ*."
        checklist:
          - "Nombraste al menos 4 ambientes o cosas con artículo, de los tres géneros."
          - "Cada sustantivo empieza con mayúscula."
          - "Mia puede imaginarse el departamento."
        model: "Liebe Mia, ich wohne jetzt in Leipzig! Die Wohnung ist alt, aber sehr schön. Das Wohnzimmer ist groß und hell. Die Küche ist klein, und der Balkon ist winzig. Mein Zimmer ist ruhig, und das Bad ist ganz neu."
        reviewed: true

      - id: t2-5-wg-wg
        type: writing-guided
        topic: a1.u1.t2
        prompt: "Contale a Mia cómo son Jana y Paul, y en qué estado está la cocina compartida."
        constraints:
          - "Una oración para Jana y otra para Paul."
          - "Al menos 2 plurales con artículo (*die Teller*, *die Tassen*…)."
        tips:
          - "En plural el artículo es uno solo; lo que cambia es la terminación del sustantivo (el glosario la muestra)."
          - "Si el sujeto es plural, *sein* va en plural: *Die Tassen sind…*"
          - "*er* y *sie* siguen el género de la palabra: *der Kühlschrank → er*, *die Küche → sie*."
        checklist:
          - "Presentaste a Jana y a Paul."
          - "Usaste al menos 2 plurales con artículo, con *sein* en plural."
          - "Se entiende cómo está la cocina (y de quién es la culpa)."
        model: "Meine Mitbewohner heißen Jana und Paul. Jana ist sehr ordentlich. Paul ist nett, aber er kocht immer um zwei Uhr nachts. Die Küche ist deshalb oft chaotisch. Die Teller sind in der Spüle, und die Tassen sind schmutzig. Der Kühlschrank ist fast immer leer."
        reviewed: true

      - id: t2-5-wf-brief
        type: writing-free
        topic: a1.u1.t2
        prompt: "Escribile a Mia una carta libre: lo mejor y lo peor del departamento, y una cosa rara que hay (siempre hay una)."
        tips:
          - "Si no sabés el género de una palabra, buscá una pista: terminación, palabra compuesta, plural."
          - "Cerrá como en una carta: *Liebe Grüße* o *Viele Grüße*, y tu nombre."
        checklist:
          - "Contaste lo mejor, lo peor y la cosa rara."
          - "Los sustantivos llevan su artículo y mayúscula."
          - "Tiene saludo y despedida de carta."
        model: "Liebe Mia, wie geht es dir? Das Beste hier ist der Balkon. Er ist klein, aber die Sonne ist super. Das Schlimmste ist die Heizung: Sie ist alt und sehr laut. Und das Komische? Im Flur steht ein Tischchen von Herrn Krause. Das Tischchen heißt Herbert! Liebe Grüße von Leo"
        reviewed: true
