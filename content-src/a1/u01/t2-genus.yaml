# Tema 2: Artikel und Genus (Nominativ).
# Personajes fijos: Leo (vos, recién salido del hostel), Jana (compañera de departamento, etiqueta todo),
# Paul (compañero, cocina a las 2 de la mañana), Herr Krause (el dueño, carteles con muchos signos de exclamación),
# Lina (la nena de la planta baja) y Mia (la amiga chilena del hostel, destinataria de la carta).
# El tema es arbitrario: el escalón 1 abre con la ficha (runner.needsFicha) y los detectives muestran las pistas.
# Política de respuestas:
# - Femenino y plural: se acepta cualquier determinante que el contexto admita (die, eine, meine, unsere, diese…),
#   porque todos muestran el género.
# - Masculino y neutro: *ein*, *mein*, *unser* son iguales en los dos géneros y no prueban nada. Por eso los huecos
#   escritos fuerzan el definido: con una primera mención con *ein* (anáfora: "Da ist ein Topf. ___ Topf…", que admite
#   der/dieser) o con una etiqueta de Jana, que según el contexto "siempre lleva artículo definido" (se acepta
#   también el demostrativo, que marca el género).
# - spot-error: la corrección acepta todo determinante gramatical y verosímil en el contexto (regla 11, lado seguro),
#   incluso *ein/mein/unser*: quien tocó el artículo equivocado ya descartó ese género.
# - order: los chunks van con la mayúscula de mitad de frase (el check pliega la primera letra) y se listan todos
#   los órdenes V2, también el que abre con el sujeto.
# - Las reglas de error nombran la pista (terminación, compuesta, plural, -chen) o dicen que el género se aprende
#   con la palabra; nunca dicen el género del sustantivo preguntado (sería decir el artículo, regla 3).
topic: a1.u1.t2
tags: [a1.nom.mask, a1.nom.fem, a1.nom.neut, a1.nom.plural, a1.ortho.nomen]
arbitrary: true
hides: [article]
ficha:
  short:
    - "Todo sustantivo alemán tiene uno de tres géneros: masculino, femenino o neutro. En *Nominativ* (el caso del sujeto) se ve en el artículo: *der Tisch*, *die Lampe*, *das Bett*. El inglés se arregla con un solo *the*; el alemán usa tres."
    - "El género es de la palabra, no de la cosa, y casi nunca coincide con el español: *der Löffel* (la cuchara), *die Gabel* (el tenedor), *das Messer* (el cuchillo). Por eso se aprende pegado: no *Tisch*, sino *der Tisch*."
    - "Hay pistas casi infalibles: *-ung*, *-heit*, *-keit* e *-ion* van con *die*; *-chen* y *-lein*, con *das* (sí: *das Mädchen*). En las palabras compuestas manda la última parte: *der Kühlschrank*, por *der Schrank*."
    - "El plural es la parte fácil: en *Nominativ* tiene un solo artículo para los tres géneros, *die*: *die Tische*, *die Lampen*, *die Betten*."
    - "El indefinido marca menos: *ein Tisch*, *eine Lampe*, *ein Bett*. Masculino y neutro comparten *ein*; en plural no hay indefinido."
    - "Todo sustantivo empieza con mayúscula, esté donde esté: *Hier ist die Küche.*"
  table:
    head: ["", "masculino", "femenino", "neutro", "plural"]
    rows:
      - ["definido", "der Tisch", "die Lampe", "das Bett", "die Tische"]
      - ["indefinido", "ein Tisch", "eine Lampe", "ein Bett", "Tische (sin artículo)"]
      - ["pistas", "aparatos en *-er* (tendencia), días, meses", "*-ung*, *-heit*, *-keit*, *-ion*; casi todas las terminadas en *-e*", "*-chen*, *-lein*; verbos usados como sustantivo (*das Essen*)", "siempre el mismo"]
      - ["en español", "la mesa", "la lámpara", "la cama", "las mesas"]
  more:
    - "Por qué tres. El indoeuropeo, el abuelo común del alemán, el inglés, el español y el portugués, tenía tres géneros. El latín los conservó (*neutrum* quiere decir 'ni uno ni otro'); el español y el portugués perdieron el neutro y repartieron esas palabras entre los otros dos. El inglés antiguo tenía tres artículos y terminó con uno solo, *the*. El alemán se quedó con todo."
    - "Que no coincida no es culpa tuya: ni el español y el portugués se ponen de acuerdo. *La leche* es *o leite*, y *el árbol* es *a árvore*. En alemán, *die Milch* y *der Baum*. El género viene con la palabra; la cosa no lo decide."
    - "La mesa puesta como ayuda-memoria: *der Löffel*, *die Gabel*, *das Messer*. Tres cubiertos, tres géneros, y ninguno coincide con el español. Si te acordás de esa mesa, tenés un ejemplo de cada uno."
    - "Con las personas el sexo sí suele contar: *der Mann*, *die Frau*, *der Vermieter* y *die Vermieterin* (la *-in* hace el femenino). La excepción famosa es *das Mädchen* (la chica): *-chen* manda más que la biología. Mark Twain se quejaba de que en alemán una chica no tiene sexo y un nabo sí (*die Rübe*)."
    - "Las pistas, en detalle. Casi infalibles: *-ung* (*die Wohnung*), *-heit* (*die Gesundheit*), *-keit* (*die Kleinigkeit*) e *-ion* (*die Information*) son femeninas; *-chen* (*das Brötchen*) y *-lein* (*das Büchlein*) son neutras. Fallan solo cuando esas letras no son un sufijo, como en *der Sprung* (el salto). Tendencias, con excepciones: casi todas las terminadas en *-e* son femeninas (*die Lampe*, *die Tasse*; pero *der Käse*, *der Name*), y los aparatos en *-er* suelen ser masculinos (*der Toaster*, *der Computer*; ojo con *das Fenster* y *das Messer*, que terminan igual y no son aparatos)."
    - "Compuestas: la última parte pone el género y la primera, el detalle. *das Wasser* + *der Kocher* = *der Wasserkocher*; *der Kaffee* + *die Maschine* = *die Kaffeemaschine*; *schlafen* + *das Zimmer* = *das Schlafzimmer*. Ganga: aprendés una palabra y te llevás diez."
    - "El plural siempre lleva el mismo artículo, sea cual sea el género del singular: *der Tisch → die Tische*, *das Bett → die Betten*. Lo difícil del plural no es el artículo sino la terminación (*-e*, *-en*, *-er*, *-s*, con o sin umlaut): por eso el glosario te muestra el plural de cada palabra."
    - "*Das ist…* no cambia. En *Das ist der Tisch* o *Das ist eine Lampe*, ese primer *das* no es un artículo sino 'esto' o 'eso', y queda fijo. El artículo es el que va pegado al sustantivo."
    - "*ein* sirve para masculino y neutro. Por eso, si dudás entre *der* y *das*, el indefinido no te delata... por ahora: en el tema siguiente, el *Akkusativ* (objeto directo), el masculino cambia y el neutro no."
    - "Mayúscula: en alemán todo sustantivo empieza con mayúscula, en cualquier lugar de la oración. La ventaja es que siempre sabés cuál es el sustantivo, y por lo tanto a quién mira el artículo."
    - "Cómo aprenderlo sin sufrir: decí el artículo pegado, como si fuera una sola palabra (*dertisch*, *dielampe*), o asociá un color a cada género. Y no te castigues: los alemanes también dudan, y algunas palabras aceptan dos géneros, como *der* o *das Joghurt*."

steps:
  # ───────────────────────────── Escalón 1 ─────────────────────────────
  - n: 1
    name: "Descubrir"
    scene: {title: "Die neue Wohnung", context: "Leipzig · sábado 10:00 · el departamento huele a pintura y Jana ya etiquetó hasta la puerta"}
    exercises:
      - id: t2-1-det-ung
        type: detective
        tag: a1.nom.fem
        sentences:
          - {de: "Die Wohnung ist hell und ruhig.", highlight: "Die"}
          - {de: "Der Balkon ist klein, aber schön.", highlight: "Der"}
          - {de: "Die Heizung ist ziemlich alt.", highlight: "Die"}
          - {de: "Das Bad ist ganz neu.", highlight: "Das"}
          - {de: "Die Rechnung vom Vermieter ist schon da.", highlight: "Die"}
          - {de: "Die Sauberkeit ist für Herrn Krause sehr wichtig.", highlight: "Die"}
        rules:
          - {text: "El artículo depende del sustantivo, y las palabras en *-ung* y *-keit* llevan siempre el mismo.", correct: true}
          - {text: "El artículo depende del adjetivo que viene después."}
          - {text: "El artículo copia el género del español: *la* calefacción, *el* balcón…"}
          - {text: "Los ambientes de la casa llevan un artículo y las cosas, otro."}
        apply:
          - {text: "___ Hausordnung hängt im Flur.", answers: ["Die", "Eine", "Unsere", "Diese"], dims: {gender: f}}
          - {text: "___ Zeitung von heute liegt im Briefkasten.", answers: ["Die", "Eine", "Meine", "Deine", "Unsere", "Eure", "Seine", "Ihre", "Diese"], dims: {gender: f}}
        curiosities: ["*die Wohnung* viene de *wohnen* (vivir): *-ung* convierte verbos en sustantivos, y todos salen femeninos."]
        reviewed: true

      - id: t2-1-ch-loeffel
        type: choice
        tag: a1.nom.mask
        prompt: "Jana busca algo para revolver el café. Vos encontrás una cuchara en una caja. ¿Qué le decís?"
        options:
          - {text: "Der Löffel ist hier!", correct: true}
          - {text: "Die Löffel ist hier!", rule: "El género alemán no se copia del español: que *cuchara* sea femenino no dice nada de *Löffel*, cuyo género se aprende con la palabra."}
          - {text: "Das Löffel ist hier!", rule: "*Löffel* no tiene ninguna pista de neutro (ni *-chen* ni *-lein*): su género se aprende con la palabra."}
        dims: {gender: m}
        curiosities: ["*der Löffel*, *die Gabel*, *das Messer*: tres cubiertos, tres géneros, y ninguno coincide con el español."]
        reviewed: true

      - id: t2-1-det-komposita
        type: detective
        tag: a1.nom.mask
        sentences:
          - {de: "Der Schrank ist aus Holz.", highlight: "Der"}
          - {de: "Der Kühlschrank ist leer.", highlight: "Der"}
          - {de: "Das Zimmer von Jana ist groß.", highlight: "Das"}
          - {de: "Das Schlafzimmer von Leo ist klein.", highlight: "Das"}
          - {de: "Die Waschmaschine ist im Keller.", highlight: "Die"}
          - {de: "Die Kaffeemaschine ist kaputt.", highlight: "Die"}
        rules:
          - {text: "En una palabra compuesta, el artículo lo pone la última parte.", correct: true}
          - {text: "En una palabra compuesta, el artículo lo pone la primera parte."}
          - {text: "Las palabras compuestas son siempre neutras."}
        apply:
          - {text: "Im Wohnzimmer steht ein Schreibtisch. ___ Schreibtisch ist von Jana.", answers: ["Der", "Dieser"], dims: {gender: m}}
          - {text: "Im Schlafzimmer steht ein Kleiderschrank. ___ Kleiderschrank ist riesig.", answers: ["Der", "Dieser"], dims: {gender: m}}
        curiosities: ["*Kühlschrank* es, literalmente, 'armario que enfría': *kühl* (fresco) + *der Schrank*."]
        reviewed: true

      - id: t2-1-ch-lampe
        type: choice
        tag: a1.nom.fem
        prompt: "En el living hay algo con forma de flamenco, con cable y una bombita. ¿Qué preguntás?"
        options:
          - {text: "Ist das eine Lampe?", correct: true}
          - {text: "Ist das ein Lampe?", rule: "El indefinido también marca el género, aunque menos que el definido: pensá qué género tienen casi todas las palabras terminadas en *-e*."}
          - {text: "Ist das einen Lampe?", rule: "*einen* es una forma de *Akkusativ* (objeto directo), que además solo existe en masculino; con *sein* todo va en *Nominativ*."}
        dims: {gender: f}
        reviewed: true

      - id: t2-1-det-chen
        type: detective
        tag: a1.nom.neut
        sentences:
          - {de: "Der Vermieter heißt Herr Krause.", highlight: "Der"}
          - {de: "Die Frau im Erdgeschoss ist sehr nett.", highlight: "Die"}
          - {de: "Das Mädchen im Erdgeschoss heißt Lina.", highlight: "Das"}
          - {de: "Die Katze von Lina ist dick.", highlight: "Die"}
          - {de: "Das Kätzchen ist noch winzig.", highlight: "Das"}
          - {de: "Das Brötchen vom Bäcker ist noch warm.", highlight: "Das"}
        rules:
          - {text: "Las palabras en *-chen* llevan siempre el mismo artículo, aunque nombren a una persona o a un animal.", correct: true}
          - {text: "El artículo depende del sexo de la persona o del animal."}
          - {text: "El artículo depende de la palabra que viene después del sustantivo."}
        apply:
          - {text: "Im Flur steht ein Tischchen. ___ Tischchen ist sehr alt.", answers: ["Das", "Dieses"], dims: {gender: n}}
          - {text: "Vor der Tür liegt ein Päckchen. ___ Päckchen ist für Jana.", answers: ["Das", "Dieses"], dims: {gender: n}}
        curiosities: ["*-chen* también suele poner umlaut: *die Katze → das Kätzchen*, *das Brot → das Brötchen*."]
        reviewed: true

      - id: t2-1-ch-stuehle
        type: choice
        tag: a1.nom.plural
        prompt: "Paul llega con su parte de la mudanza: catorce cajas de discos y ni una silla. Jana lo mira. ¿Qué pregunta?"
        options:
          - {text: "Wo sind die Stühle?", correct: true}
          - {text: "Wo sind der Stühle?", rule: "*Stühle* es plural: en plural hay un solo artículo para los tres géneros, sea cual sea el del singular."}
          - {text: "Wo sind das Stühle?", rule: "*Stühle* es plural: en plural hay un solo artículo para los tres géneros, sea cual sea el del singular."}
        dims: {gender: pl}
        reviewed: true

      # Reserva
      - id: t2-1-det-plural
        type: detective
        tag: a1.nom.plural
        reserve: true
        sentences:
          - {de: "Der Tisch ist neu.", highlight: "Der"}
          - {de: "Die Tische sind alt.", highlight: "Die"}
          - {de: "Das Bett ist bequem.", highlight: "Das"}
          - {de: "Die Betten sind zu kurz.", highlight: "Die"}
          - {de: "Die Lampe ist schön.", highlight: "Die"}
          - {de: "Die Lampen sind kaputt.", highlight: "Die"}
        rules:
          - {text: "En plural el artículo es siempre el mismo, sea cual sea el género del singular.", correct: true}
          - {text: "En plural cada sustantivo conserva el artículo del singular."}
          - {text: "El plural toma siempre el artículo del masculino."}
          - {text: "Los sustantivos en plural van sin artículo."}
        apply:
          - {text: "Im Wohnzimmer stehen zwei Sofas. ___ Sofas sind grün.", answers: ["Die", "Diese", "Beide", "Unsere"], dims: {gender: pl}}
          - {text: "Im Keller sind drei Fahrräder. ___ Fahrräder sind von Paul.", answers: ["Die", "Diese", "Alle"], dims: {gender: pl}}
          - {text: "In der Küche hängen vier Lampen. ___ Lampen sind sehr alt.", answers: ["Die", "Diese", "Alle", "Unsere"], dims: {gender: pl}}
        reviewed: true

  # ───────────────────────────── Escalón 2 ─────────────────────────────
  - n: 2
    name: "Reconocer"
    scene: {title: "Umzugstag", context: "Sábado · 9:00 · 23 cajas, un sofá que no pasa por la puerta y Paul, que 'solo trae una mochila'"}
    exercises:
      - id: t2-2-ord-toaster
        type: order
        tag: a1.nom.mask
        prompt: "Paul pregunta qué hay en la caja 3. Contestale."
        chunks: ["und", "der", "im Karton", "Lampe", "sind", "die", "Toaster"]
        answers:
          - ["im Karton", "sind", "der", "Toaster", "und", "die", "Lampe"]
          - ["im Karton", "sind", "die", "Lampe", "und", "der", "Toaster"]
          - ["der", "Toaster", "und", "die", "Lampe", "sind", "im Karton"]
          - ["die", "Lampe", "und", "der", "Toaster", "sind", "im Karton"]
        dims: {gender: m}
        reviewed: true

      - id: t2-2-se-sofa
        type: spot-error
        tag: a1.nom.neut
        prompt: "Mensaje de Paul desde la escalera. Tiene un error."
        tokens: ["Der", "Sofa", "passt", "nicht", "durch", "die", "Tür!"]
        wrong: 0
        corrections: ["Das", "Dieses", "Unser", "Euer", "Dein", "Mein", "Ein"]
        rule: "El género de *Sofa* no se copia del español (*el sofá*): se aprende con la palabra."
        dims: {gender: n}
        reviewed: true

      - id: t2-2-ch-maedchen
        type: choice
        tag: a1.nom.neut
        prompt: "La nena de la planta baja (8 años) se asoma por tercera vez a preguntar si sos el nuevo. ¿Qué le contás después a Paul?"
        options:
          - {text: "Das Mädchen von unten ist super neugierig.", correct: true}
          - {text: "Die Mädchen von unten ist super neugierig.", rule: "Con *-chen* el género lo pone la terminación, no la persona: todas las palabras en *-chen* llevan el mismo artículo."}
          - {text: "Der Mädchen von unten ist super neugierig.", rule: "Con *-chen* el género lo pone la terminación, no la persona: todas las palabras en *-chen* llevan el mismo artículo."}
        dims: {gender: n}
        curiosities: ["Mark Twain se quejaba de que en alemán una chica no tiene sexo y un nabo sí: *das Mädchen*, pero *die Rübe*."]
        reviewed: true

      - id: t2-2-ord-fahrrad
        type: order
        tag: a1.nom.neut
        prompt: "Jana pregunta qué quedó en el balcón."
        chunks: ["die", "auf dem Balkon", "Pflanzen", "das", "und", "sind", "Fahrrad"]
        answers:
          - ["auf dem Balkon", "sind", "das", "Fahrrad", "und", "die", "Pflanzen"]
          - ["auf dem Balkon", "sind", "die", "Pflanzen", "und", "das", "Fahrrad"]
          - ["das", "Fahrrad", "und", "die", "Pflanzen", "sind", "auf dem Balkon"]
          - ["die", "Pflanzen", "und", "das", "Fahrrad", "sind", "auf dem Balkon"]
        dims: {gender: n}
        reviewed: true

      - id: t2-2-se-lampe
        type: spot-error
        tag: a1.nom.fem
        prompt: "Etiqueta de Jana en una caja. Tiene un error."
        tokens: ["Vorsicht!", "Das", "Lampe", "ist", "zerbrechlich."]
        wrong: 1
        corrections: ["Die", "Diese", "Meine", "Deine", "Unsere"]
        rule: "*Lampe* termina en *-e*: pensá qué género tienen casi todas las palabras con esa terminación."
        dims: {gender: f}
        reviewed: true

      - id: t2-2-se-kartons
        type: spot-error
        tag: a1.nom.plural
        prompt: "Mensaje de Paul, orgulloso de sí mismo. Tiene un error."
        tokens: ["Das", "Kartons", "sind", "alle", "im", "Flur."]
        wrong: 0
        corrections: ["Die", "Diese", "Unsere", "Eure", "Deine", "Meine"]
        rule: "*Kartons* es plural: en plural hay un solo artículo para los tres géneros."
        dims: {gender: pl}
        reviewed: true

      - id: t2-2-ord-decke
        type: order
        tag: a1.nom.fem
        prompt: "Paul ya se instaló en el sofá nuevo. Contale a Jana qué hay ahí."
        chunks: ["Kissen", "sind", "die", "auf dem Sofa", "das", "und", "Decke"]
        answers:
          - ["auf dem Sofa", "sind", "die", "Decke", "und", "das", "Kissen"]
          - ["auf dem Sofa", "sind", "das", "Kissen", "und", "die", "Decke"]
          - ["die", "Decke", "und", "das", "Kissen", "sind", "auf dem Sofa"]
          - ["das", "Kissen", "und", "die", "Decke", "sind", "auf dem Sofa"]
        dims: {gender: f}
        reviewed: true

      - id: t2-2-se-kuehlschrank
        type: spot-error
        tag: a1.nom.mask
        prompt: "Jana avisa en el grupo de la casa. Tiene un error."
        tokens: ["Die", "Kühlschrank", "von", "Herrn", "Krause", "ist", "schon", "in", "der", "Küche."]
        wrong: 0
        corrections: ["Der", "Dieser"]
        rule: "En las palabras compuestas manda la última parte: *Kühl-schrank*."
        dims: {gender: m}
        reviewed: true

      - id: t2-2-ch-wasserkocher
        type: choice
        tag: a1.nom.mask
        prompt: "Paul saca algo de una caja: '¿Y esto?'. Es la pava eléctrica de Jana. ¿Qué le contestás?"
        options:
          - {text: "Das ist der Wasserkocher von Jana.", correct: true}
          - {text: "Das ist das Wasserkocher von Jana.", rule: "El primer *das* (esto) queda fijo; el artículo de *Wasserkocher* lo pone la última parte de la palabra, no *Wasser*."}
          - {text: "Das ist die Wasserkocher von Jana.", rule: "En las palabras compuestas manda la última parte: *Wasser-kocher*."}
        dims: {gender: m}
        reviewed: true

      - id: t2-2-se-auto
        type: spot-error
        tag: a1.ortho.nomen
        prompt: "Mensaje de Paul desde la calle. Tiene un error."
        tokens: ["Mein", "Rucksack", "ist", "noch", "im", "auto."]
        wrong: 5
        corrections: ["Auto"]
        rule: "En alemán todo sustantivo empieza con mayúscula, también en medio de la oración."
        dims: {gender: n}
        reviewed: true

      - id: t2-2-ord-handtuecher
        type: order
        tag: a1.nom.plural
        prompt: "Jana pregunta qué hay ya en el baño."
        chunks: ["Handtücher", "der", "und", "im Bad", "Spiegel", "sind", "die"]
        answers:
          - ["im Bad", "sind", "der", "Spiegel", "und", "die", "Handtücher"]
          - ["im Bad", "sind", "die", "Handtücher", "und", "der", "Spiegel"]
          - ["der", "Spiegel", "und", "die", "Handtücher", "sind", "im Bad"]
          - ["die", "Handtücher", "und", "der", "Spiegel", "sind", "im Bad"]
        dims: {gender: pl}
        reviewed: true

      - id: t2-2-se-kaffeemaschine
        type: spot-error
        tag: a1.nom.fem
        prompt: "Mensaje de Paul a las 7:00 del día siguiente. Tiene un error."
        tokens: ["Wo", "ist", "der", "Kaffeemaschine?", "Ich", "brauche", "Kaffee!"]
        wrong: 2
        corrections: ["die", "eure", "unsere", "deine", "meine", "diese"]
        rule: "En las palabras compuestas manda la última parte, no la primera: *Kaffee* no decide."
        dims: {gender: f}
        reviewed: true

      - id: t2-2-se-paeckchen
        type: spot-error
        tag: a1.nom.neut
        prompt: "Nota de Jana en la puerta. Tiene un error."
        tokens: ["Der", "Päckchen", "vor", "der", "Tür", "ist", "für", "dich,", "Leo!"]
        wrong: 0
        corrections: ["Das", "Dieses", "Ein"]
        rule: "Las palabras en *-chen* tienen todas el mismo género, sin excepción."
        dims: {gender: n}
        reviewed: true

      - id: t2-2-se-klingel
        type: spot-error
        tag: a1.nom.fem
        prompt: "Otra etiqueta de Jana, esta vez al lado de la puerta. Tiene un error."
        tokens: ["Achtung:", "Das", "Klingel", "ist", "kaputt!"]
        wrong: 1
        corrections: ["Die", "Diese", "Unsere"]
        rule: "El género de *Klingel* no sale del español (*el timbre*): se aprende con la palabra."
        dims: {gender: f}
        reviewed: true

      - id: t2-2-ch-pfanne
