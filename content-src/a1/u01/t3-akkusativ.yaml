# Tema 3: Akkusativ con haben, möchten y brauchen.
# Personajes: Leo (vos), Jana y Paul (los compañeros del departamento del tema 2), Frau Becker (la panadera),
# Herr Yilmaz (el kiosco de la esquina, abierto hasta medianoche) y Mia (la amiga chilena, invitada a la cena).
# El patrón se puede deducir: el escalón 1 abre con detective (ein/einen, der/den) y la ficha aparece después.
# Política de respuestas:
# - El rasgo evaluado es el caso del objeto según el género. Todo determinante en Akkusativ que el contexto admita y que
#   muestre el mismo género se acepta (einen/den/keinen/meinen/diesen para un masculino), salvo que cambie el sentido
#   de la frase (un *kein* donde se pide algo, un *ein* donde la frase niega).
# - Los huecos fuerzan el determinante con la frase: "noch … bitte" (otro más), "… mehr" (ya no), una anáfora
#   ("Der Käsekuchen ist super. Ich möchte ___ Käsekuchen.") o un contexto que lo dice.
# - Los huecos usan sustantivos con plural distinto del singular cuando un número (*zwei*) cabría en el hueco.
# - order: chunks en mayúscula de mitad de frase (el check pliega la primera letra) y todos los órdenes V2:
#   sujeto primero y objeto primero (*Den Käse habe ich schon*).
# - Las reglas de error nombran la regla (el verbo pide Akkusativ; un solo género cambia; *sein* no tiene objeto)
#   y nunca dicen el género del sustantivo preguntado ni la forma correcta. Pueden decir de qué género NO es la forma
#   que se escribió ("*eine* acompaña a un solo género, y no es el de…"), como el diagnóstico de los gaps generados.
# - Escalón 5: LanguageTool casi nunca marca un artículo mal declinado ("Ich habe ein Hund." pasa sin marca), así que
#   cada checklist pide revisar a mano cada artículo después de haben/möchten/brauchen.
topic: a1.u1.t3
tags: [a1.akk.mask, a1.akk.fem, a1.akk.neut, a1.akk.plural]
arbitrary: false
hides: []
ficha:
  short:
    - "Con *haben*, *möchten* y *brauchen*, lo que tenés, querés o necesitás es el objeto directo y va en *Akkusativ* (objeto directo). Quien tiene o quiere es el sujeto y sigue en *Nominativ*."
    - "La buena noticia: solo cambia el masculino. *der → den*, *ein → einen*, *kein → keinen*. Femenino, neutro y plural quedan igual: *Ich brauche einen Löffel, eine Tasse und ein Glas.*"
    - "Manda la función, no el lugar: *Der Kuchen ist warm* (sujeto), pero *Ich möchte den Kuchen* (objeto). Aunque vaya primero, *Den Kuchen möchte ich* sigue siendo el objeto: la *-n* lo marca esté donde esté."
    - "*sein* no tiene objeto: en *Das ist der Kuchen* todo va en *Nominativ*."
    - "Sin artículo también vale, como en español: *Ich brauche Milch* (leche) frente a *Ich möchte einen Kaffee* (un café, una taza). En plural no hay *ein*: *Ich brauche Eier*, *Ich habe keine Eier*."
  table:
    head: ["", "masculino", "femenino", "neutro", "plural"]
    rows:
      - ["Nominativ (sujeto)", "der · ein · kein Kuchen", "die · eine · keine Tasse", "das · ein · kein Brot", "die · – · keine Eier"]
      - ["Akkusativ (objeto)", "den · einen · keinen Kuchen", "die · eine · keine Tasse", "das · ein · kein Brot", "die · – · keine Eier"]
      - ["¿cambia?", "sí", "no", "no", "no"]
  more:
    - "Por qué existe. El alemán marca en el artículo quién hace y quién recibe. Por eso puede mover las piezas: *Der Hund beißt den Mann* y *Den Hund beißt der Mann* tienen el mismo orden de palabras, pero en la segunda el que muerde es el hombre. El orden no decide; decide el artículo."
    - "El español también lo tiene, escondido en los pronombres: *él* es el sujeto, pero *lo quiero*. El portugués igual: *ele* frente a *eu o quero*. El alemán hace con el artículo masculino lo que nosotros hacemos con el pronombre."
    - "El inglés lo tuvo y lo perdió. En inglés antiguo el artículo masculino era *se* como sujeto y *þone* como objeto, pariente directo de *den*. Sobrevive solo en los pronombres: *he → him*, *who → whom*. El alemán conservó el sistema entero."
    - "Por qué solo el masculino. El neutro siempre fue igual como sujeto y como objeto (en latín, *templum* sirve para los dos). El femenino sí los distinguía (latín *rosa* / *rosam*), pero el germánico los igualó. El masculino conservó su *-n*: *den*, *einen*. Una sola terminación distinta, y por lo tanto una sola regla."
    - "*kein* es *k* + *ein* y se declina igual: *einen → keinen*, *eine → keine*, *ein → kein*. En plural, donde no hay *ein*, *kein* sí existe: *keine Eier*."
    - "*möchten* es la forma cortés de *mögen* (gustar): literalmente 'me gustaría'. Es el *quisiera* alemán, y es lo que se dice en una panadería. *Ich will einen Kaffee* (quiero un café) suena a nene caprichoso."
    - "Con o sin artículo, como en español: *Ich brauche Milch* (leche, sin cantidad) o *Ich möchte eine Milch* (un vaso, un cartón). *Ich möchte Kaffee* es 'quiero café'; *Ich möchte einen Kaffee* es 'quiero un café'. Si no hay artículo, no hay nada que declinar."
    - "Otros verbos con *Akkusativ*: casi todos los que tienen un objeto directo. *kaufen* (comprar), *essen* (comer), *trinken* (tomar), *nehmen* (llevar, tomar), *suchen* (buscar) y *es gibt* (hay): *Es gibt einen Kiosk an der Ecke*."
    - "*sein* es la excepción famosa: no tiene objeto, lo que viene después es otra forma de nombrar al sujeto. *Das ist ein Kiosk* (Nominativ) frente a *Ich suche einen Kiosk* (Akkusativ)."
    - "Truco para el masculino: la *-n* de *den* y *einen* es la misma de *ihn* (a él) y *wen* (a quién). Si dudás, preguntá *wen?*: *Wen brauchst du? — Den Bäcker.* Si la respuesta sale con *wen*, es *Akkusativ*."

steps:
  # ───────────────────────────── Escalón 1 ─────────────────────────────
  - n: 1
    name: "Descubrir"
    scene: {title: "In der Bäckerei", context: "Sábado · 7:40 · con hambre, el abrigo arriba del pijama y una fila que llega a la puerta"}
    exercises:
      - id: t3-1-det-einen
        type: detective
        tag: a1.akk.mask
        sentences:
          - {de: "Ein Kuchen kostet heute nur zwei Euro.", highlight: "Ein"}
          - {de: "Dann möchte ich einen Kuchen, bitte.", highlight: "einen"}
          - {de: "Heute ist ein Kaffee gratis.", highlight: "ein"}
          - {de: "Super, ich habe sogar einen Becher dabei!", highlight: "einen"}
          - {de: "Hinter mir steht ein Mann im Schlafanzug.", highlight: "ein"}
          - {de: "Der Mann braucht dringend einen Kaffee.", highlight: "einen"}
        rules:
          - {text: "Cambia cuando el sustantivo es lo que alguien tiene, quiere o necesita (el objeto directo); cuando es el sujeto, no cambia.", correct: true}
          - {text: "Cambia cuando el sustantivo va después del verbo."}
          - {text: "Cambia en las frases con *ich*."}
          - {text: "Cambia con las cosas de comer y de tomar."}
        apply:
          - {text: "Paul ist noch total müde. Er braucht ___ Kaffee.", answers: ["einen", "seinen"], dims: {gender: m}}
          - {text: "Hinter dir wartet ein Kind. Es möchte ___ Keks.", answers: ["einen"], dims: {gender: m}}
          - {text: "Ich möchte auch ___ Brot mit Käse.", answers: ["ein", "das", "dieses"], dims: {gender: n}}
        curiosities: ["*möchten* es el *quisiera* alemán: la forma cortés de *mögen* (gustar). Es lo que se dice en una panadería."]
        reviewed: true

      - id: t3-1-ch-kaffee
        type: choice
        tag: a1.akk.mask
        prompt: "Te toca. Frau Becker te mira por arriba de los anteojos. Querés un café para llevar."
        options:
          - {text: "Ich möchte einen Kaffee zum Mitnehmen, bitte.", correct: true}
          - {text: "Ich möchte ein Kaffee zum Mitnehmen, bitte.", rule: "Con *möchten*, el café es el objeto directo y va en *Akkusativ*: revisá si su género es el que cambia."}
          - {text: "Ich möchte eine Kaffee zum Mitnehmen, bitte.", rule: "*eine* acompaña a un solo género, y no es el de *Kaffee*."}
        dims: {gender: m}
        curiosities: ["*zum Mitnehmen* es 'para llevar' (literalmente 'para el llevarse'); 'para comer acá' es *zum Hieressen*."]
        reviewed: true

      - id: t3-1-det-den
        type: detective
        tag: a1.akk.mask
        sentences:
          - {de: "Der Apfelkuchen ist noch warm.", highlight: "Der"}
          - {de: "Ich möchte den Apfelkuchen, bitte.", highlight: "den"}
          - {de: "Die Torte sieht fantastisch aus.", highlight: "Die"}
          - {de: "Paul möchte die Torte mit Erdbeeren.", highlight: "die"}
          - {de: "Das Brot ist von heute Morgen.", highlight: "Das"}
          - {de: "Jana braucht das Brot für morgen.", highlight: "das"}
        rules:
          - {text: "Cuando el sustantivo es el objeto, cambia un solo género; los otros dos quedan igual que como sujeto.", correct: true}
          - {text: "Cuando el sustantivo es el objeto, cambian los tres géneros."}
          - {text: "No cambia nada: el artículo depende solo del género."}
          - {text: "El artículo cambia cuando el sustantivo es lo último de la frase."}
        apply:
          - {text: "Der Käsekuchen ist super. Ich möchte ___ Käsekuchen.", answers: ["den", "diesen", "einen"], dims: {gender: m}}
          - {text: "Die Schokolade sieht gut aus. Jana möchte ___ Schokolade.", answers: ["die", "diese", "eine"], dims: {gender: f}}
          - {text: "Das Vollkornbrot ist von heute. Ich möchte ___ Vollkornbrot.", answers: ["das", "dieses", "ein"], dims: {gender: n}}
        reviewed: true

      - id: t3-1-ch-brot
        type: choice
        tag: a1.akk.neut
        prompt: "Frau Becker: '¿Algo más?'. Falta el pan para el desayuno de la casa."
        options:
          - {text: "Ja, ich brauche noch ein Brot.", correct: true}
          - {text: "Ja, ich brauche noch einen Brot.", rule: "En *Akkusativ* cambia un solo género, y *Brot* no es de ese: revisá su género."}
          - {text: "Ja, ich brauche noch eine Brot.", rule: "*eine* acompaña a un solo género, y no es el de *Brot*."}
        dims: {gender: n}
        reviewed: true

      - id: t3-1-ch-sein
        type: choice
        tag: a1.akk.mask
        prompt: "En el mostrador quedó un café abandonado. ¿Será el de Paul, que salió corriendo? Preguntale a Frau Becker."
        options:
          - {text: "Ist das der Kaffee von Paul?", correct: true}
          - {text: "Ist das den Kaffee von Paul?", rule: "*sein* no tiene objeto directo: lo que va con *sein* es otra forma de nombrar al sujeto y queda en *Nominativ*."}
          - {text: "Ist das die Kaffee von Paul?", rule: "*die* acompaña a otro género (o al plural): el de *Kaffee* se aprende con la palabra."}
        dims: {gender: m}
        curiosities: ["*sein* es como un signo igual: *Das = der Kaffee*. Por eso los dos lados van en *Nominativ*."]
        reviewed: true

      # Reserva
      - id: t3-1-det-kein
        type: detective
        tag: a1.akk.mask
        reserve: true
        sentences:
          - {de: "Frau Becker hat heute keinen Apfelkuchen.", highlight: "keinen"}
          - {de: "Kein Kuchen ist so gut wie ihr Apfelkuchen.", highlight: "Kein"}
          - {de: "Ich brauche keinen Zucker im Kaffee.", highlight: "keinen"}
          - {de: "Paul möchte keine Milch.", highlight: "keine"}
          - {de: "Jana möchte heute kein Brötchen.", highlight: "kein"}
          - {de: "Das ist kein Problem.", highlight: "kein"}
        rules:
          - {text: "*kein* cambia igual que *ein*: en un solo género, y solo cuando el sustantivo es el objeto.", correct: true}
          - {text: "*kein* cambia en los tres géneros cuando el sustantivo es el objeto."}
          - {text: "*kein* cambia porque la frase es negativa."}
          - {text: "*kein* no cambia nunca."}
        apply:
          - {text: "Frau Becker hat heute ___ Käsekuchen. Schade!", answers: ["keinen"], dims: {gender: m}}
          - {text: "Jana macht Diät. Sie möchte ___ Keks.", answers: ["keinen"], dims: {gender: m}}
          - {text: "Paul trinkt den Kaffee schwarz. Er braucht ___ Milch.", answers: ["keine"], dims: {gender: f}}
        curiosities: ["*kein* es *k* + *ein*, y por eso se declina igual que *ein*: aprendés uno y te llevás el otro."]
        reviewed: true

  # ───────────────────────────── Escalón 2 ─────────────────────────────
  - n: 2
    name: "Reconocer"
    scene: {title: "Im Supermarkt", context: "Sábado · 11:00 · la lista de Jana, un changuito con una rueda rebelde y Paul, que 'solo viene a mirar'"}
    exercises:
      - id: t3-2-ord-salat
        type: order
        tag: a1.akk.mask
        prompt: "Jana escribe: '¿Qué falta para la cena?'. Contestale."
        chunks: ["Zwiebel", "einen", "brauchen", "und", "wir", "eine", "Salat"]
        answers:
          - ["wir", "brauchen", "einen", "Salat", "und", "eine", "Zwiebel"]
          - ["wir", "brauchen", "eine", "Zwiebel", "und", "einen", "Salat"]
          - ["einen", "Salat", "und", "eine", "Zwiebel", "brauchen", "wir"]
          - ["eine", "Zwiebel", "und", "einen", "Salat", "brauchen", "wir"]
        dims: {gender: m}
        reviewed: true

      - id: t3-2-se-wein
        type: spot-error
        tag: a1.akk.mask
        prompt: "Mensaje de Jana. Tiene un error."
        tokens: ["Wir", "brauchen", "noch", "ein", "Wein", "für", "heute", "Abend!"]
        wrong: 3
        corrections: ["einen", "den"]
        rule: "*brauchen* pide *Akkusativ* (objeto directo): el vino es lo que se necesita, no el sujeto."
        dims: {gender: m}
        reviewed: true

      - id: t3-2-ord-geldbeutel
        type: order
        tag: a1.akk.mask
        prompt: "Paul perdió la billetera en el súper. Avisale que la tiene el cajero."
        chunks: ["den", "Geldbeutel", "hat", "Kassierer", "der"]
        answers:
          - ["der", "Kassierer", "hat", "den", "Geldbeutel"]
          - ["den", "Geldbeutel", "hat", "der", "Kassierer"]
        dims: {gender: m}
        curiosities: ["*Der Kassierer hat den Geldbeutel* y *Den Geldbeutel hat der Kassierer* dicen lo mismo. *Der Geldbeutel hat den Kassierer* también es gramatical: una billetera con un cajero adentro."]
        reviewed: true

      - id: t3-2-se-brot
        type: spot-error
        tag: a1.akk.neut
        prompt: "Le contás a Jana qué tenés. Tiene un error."
        tokens: ["Ich", "habe", "einen", "Brot", "im", "Korb."]
        wrong: 2
        corrections: ["ein", "das"]
        rule: "En *Akkusativ* cambia un solo género, y *Brot* no es de ese: revisá su género."
        dims: {gender: n}
        reviewed: true

      - id: t3-2-ch-hund
        type: choice
        tag: a1.akk.mask
        prompt: "En la puerta del súper hay un perro atado y un señor con cara de pocos amigos. Paul exagera: 'El señor muerde al perro'. ¿Qué frase dice eso?"
        options:
          - {text: "Den Hund beißt der Mann.", correct: true}
          - {text: "Der Hund beißt den Mann.", rule: "En esta frase muerde el perro. El que hace la acción va en *Nominativ* y el que la recibe, en *Akkusativ*, esté donde esté en la frase."}
          - {text: "Der Hund beißt der Mann.", rule: "Así quedan dos sujetos y ningún objeto: el que recibe la mordida es el objeto directo y va en *Akkusativ*."}
        dims: {gender: m}
        curiosities: ["*Den Hund beißt der Mann* es el ejemplo clásico de las gramáticas alemanas: el orden de las palabras es el de 'el perro muerde al hombre', pero el artículo da vuelta la noticia."]
        reviewed: true

      - id: t3-2-se-supermarkt
        type: spot-error
        tag: a1.akk.mask
        prompt: "Paul llega tarde y protesta. Tiene un error."
        tokens: ["Den", "Supermarkt", "ist", "heute", "total", "voll!"]
        wrong: 0
        corrections: ["Der", "Dieser", "Unser"]
        rule: "*sein* no tiene objeto directo: lo que va con *sein* es el sujeto y queda en *Nominativ*."
        dims: {gender: m}
        reviewed: true

      - id: t3-2-ord-brot
        type: order
        tag: a1.akk.neut
        prompt: "En la panadería del súper, señalás lo que querés."
        chunks: ["Kuchen", "das", "möchte", "und", "Brot", "den", "ich"]
        answers:
          - ["ich", "möchte", "das", "Brot", "und", "den", "Kuchen"]
          - ["ich", "möchte", "den", "Kuchen", "und", "das", "Brot"]
          - ["das", "Brot", "und", "den", "Kuchen", "möchte", "ich"]
          - ["den", "Kuchen", "und", "das", "Brot", "möchte", "ich"]
        dims: {gender: n}
        reviewed: true

      - id: t3-2-se-tuete
        type: spot-error
        tag: a1.akk.fem
        prompt: "Paul se olvidó las bolsas de tela. Le habla a la cajera. Tiene un error."
        tokens: ["Ich", "brauche", "einen", "Tüte,", "bitte."]
        wrong: 2
        corrections: ["eine", "die"]
        rule: "*einen* acompaña a un solo género, y no es el de *Tüte*."
        dims: {gender: f}
        reviewed: true

      - id: t3-2-ch-wasser
        type: choice
        tag: a1.akk.neut
        prompt: "Jana pregunta por chat si ya agarraste el agua."
        options:
          - {text: "Ja, ich habe das Wasser schon.", correct: true}
          - {text: "Ja, ich habe den Wasser schon.", rule: "En *Akkusativ* cambia un solo género, y *Wasser* no es de ese: revisá su género."}
          - {text: "Ja, ich habe die Wasser schon.", rule: "*die* acompaña a otro género (o al plural): el de *Wasser* se aprende con la palabra."}
        dims: {gender: n}
        reviewed: true

      - id: t3-2-se-kaese
        type: spot-error
        tag: a1.akk.mask
        prompt: "Jana agrega algo a la lista. Tiene un error."
        tokens: ["Paul", "möchte", "nur", "der", "Käse", "aus", "Holland."]
        wrong: 3
        corrections: ["den", "diesen", "einen"]
        rule: "Con *möchten*, el queso es lo que Paul quiere: el objeto directo, que va en *Akkusativ*."
        dims: {gender: m}
        reviewed: true

      - id: t3-2-ord-milch
        type: order
        tag: a1.akk.fem
        prompt: "Abrís la heladera de la casa antes de salir. Avisale a Jana."
        chunks: ["Käse", "keine", "haben", "keinen", "Milch", "wir", "und"]
        answers:
          - ["wir", "haben", "keine", "Milch", "und", "keinen", "Käse"]
          - ["wir", "haben", "keinen", "Käse", "und", "keine", "Milch"]
          - ["keine", "Milch", "und", "keinen", "Käse", "haben", "wir"]
          - ["keinen", "Käse", "und", "keine", "Milch", "haben", "wir"]
        dims: {gender: f}
        reviewed: true

      - id: t3-2-se-tomaten
        type: spot-error
        tag: a1.akk.plural
        prompt: "Le contás a Jana lo que ya está en el changuito. Tiene un error."
        tokens: ["Ich", "habe", "den", "Tomaten", "schon", "im", "Korb."]
        wrong: 2
        corrections: ["die", "deine", "diese"]
        rule: "*Tomaten* es plural, y el plural no cambia en *Akkusativ*: tiene un solo artículo para los tres géneros."
        dims: {gender: pl}
        reviewed: true

      - id: t3-2-ord-eier
        type: order
        tag: a1.akk.plural
        prompt: "Jana pregunta si ya tenés los huevos y el queso."
        chunks: ["schon", "Käse", "die", "habe", "und", "Eier", "den", "ich"]
        answers:
          - ["ich", "habe", "die", "Eier", "und", "den", "Käse", "schon"]
          - ["ich", "habe", "den", "Käse", "und", "die", "Eier", "schon"]
          - ["ich", "habe", "schon", "die", "Eier", "und", "den", "Käse"]
          - ["ich", "habe", "schon", "den", "Käse", "und", "die", "Eier"]
          - ["die", "Eier", "und", "den", "Käse", "habe", "ich", "schon"]
          - ["den", "Käse", "und", "die", "Eier", "habe", "ich", "schon"]
        dims: {gender: pl}
        reviewed: true

      - id: t3-2-se-schokolade
        type: spot-error
        tag: a1.akk.fem
        prompt: "Paul, en la fila de la caja, con cara de nene. Tiene un error."
        tokens: ["Leo,", "ich", "möchte", "einen", "Schokolade!", "Bitte!"]
        wrong: 3
        corrections: ["eine", "die", "diese"]
        rule: "*einen* acompaña a un solo género, y no es el de *Schokolade*."
        dims: {gender: f}
        reviewed: true

      - id: t3-2-ch-aepfel
        type: choice
        tag: a1.akk.plural
        prompt: "La lista de Jana dice: 'Äpfel (¡varios!)'. Ya están en el changuito. ¿Qué le contestás?"
        options:
          - {text: "Ich habe die Äpfel schon.", correct: true}
          - {text: "Ich habe den Äpfel schon.", rule: "*Äpfel* es plural, y el plural no cambia en *Akkusativ*: tiene un solo artículo para los tres géneros."}
          - {text: "Ich habe einen Äpfel schon.", rule: "*Äpfel* es plural, y en plural no hay artículo indefinido."}
        dims: {gender: pl}
        reviewed: true

      # Reserva
      - id: t3-2-ord-hund
        type: order
        tag: a1.akk.mask
        reserve: true
        prompt: "En la góndola de comida para mascotas, Paul se pone sentimental. Contale a Jana qué quiere."
        chunks: ["eine", "Katze", "möchte", "Hund", "Paul", "und", "einen"]
        answers:
          - ["Paul", "möchte", "einen", "Hund", "und", "eine", "Katze"]
          - ["Paul", "möchte", "eine", "Katze", "und", "einen", "Hund"]
          - ["einen", "Hund", "und", "eine", "Katze", "möchte", "Paul"]
          - ["eine", "Katze", "und", "einen", "Hund", "möchte", "Paul"]
        dims: {gender: m}
        reviewed: true

      - id: t3-2-ord-tuete
        type: order
        tag: a1.akk.fem
        reserve: true
        prompt: "En la caja, la cajera pregunta si querés algo más. Querés una bolsa y el ticket."
        chunks: ["Kassenbon", "eine", "und", "ich", "den", "Tüte", "möchte"]
        answers:
